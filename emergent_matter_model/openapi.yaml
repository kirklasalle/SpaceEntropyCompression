openapi: 3.0.3
info:
  title: Emergent Matter Simulation API
  version: 1.2.0
  description: |
    REST API for emergent matter simulation. Entropy S(X,t) is a thermodynamic state
    field (the arrow of change per Second Law), not a spatial coordinate. The last
    entry in X_grid is the entropy state sweep; output M[..., j] is matter at state S_j.
servers:
  - url: http://127.0.0.1:5000
paths:
  /api/v1/health:
    get:
      summary: Service health check
      operationId: health
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  service: {type: string}
                  version: {type: string}
  /api/v1/version:
    get:
      summary: Software and API version
      operationId: version
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {type: string}
                  api_version: {type: string}
  /api/v1/doctor:
    get:
      summary: Environment and dependency diagnostics (same as `emrf doctor`)
      operationId: doctor
      responses:
        '200':
          description: Read-only diagnostics report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/commands:
    get:
      summary: List every registered program (same as `emrf list`)
      operationId: listCommands
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [data, analysis, stress-test, figures, visualization, service, audit, release]
      responses:
        '200':
          description: Registered programs
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_enabled: {type: boolean}
                  commands:
                    type: array
                    items: {$ref: '#/components/schemas/Command'}
        '400':
          description: Unknown category
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/v1/commands/{name}:
    get:
      summary: Describe one registered program
      operationId: getCommand
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Program description
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Command'}
        '404':
          description: Unknown program
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/v1/commands/{name}/run:
    post:
      summary: Run a registered program (same as `emrf run`)
      description: |
        Disabled (403) unless the server process has EMRF_API_ALLOW_RUN=1. Enable only on
        trusted hosts. GUI and service programs are refused. No shell is used; args are
        passed verbatim to the program.
      operationId: runCommand
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                args:
                  type: array
                  items: {type: string}
                timeout:
                  type: number
                  default: 300
                  maximum: 600
      responses:
        '200':
          description: Program finished (inspect returncode)
          content:
            application/json:
              schema:
                type: object
                properties:
                  command: {type: string}
                  args: {type: array, items: {type: string}}
                  returncode: {type: integer}
                  seconds: {type: number}
                  stdout: {type: string}
                  stderr: {type: string}
        '400': {description: Invalid request or non-runnable program, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '403': {description: Execution disabled, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Unknown program, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '429': {description: Rate limited, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '504': {description: Timed out, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/v1/datasets:
    get:
      summary: Curated observational data catalog (same as `emrf data catalog`)
      operationId: listDatasets
      parameters:
        - name: verify
          in: query
          required: false
          description: Re-hash managed objects (read-only)
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Catalog datasets and managed-store status
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasets:
                    type: array
                    items: {$ref: '#/components/schemas/Dataset'}
  /api/v1/datasets/{dataset_id}:
    get:
      summary: Describe one catalog dataset
      operationId: getDataset
      parameters:
        - {name: dataset_id, in: path, required: true, schema: {type: string}}
        - {name: verify, in: query, required: false, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Catalog metadata and managed status}
        '404': {description: Unknown dataset, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /api/v1/datasets/{dataset_id}/import:
    post:
      summary: Import local pinned data into the managed store
      operationId: importDataset
      parameters:
        - {name: dataset_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logical_name: {type: string}
                source: {type: string}
      responses:
        '201': {description: Imported immutable holdings}
        '403': {description: Data mutation disabled}
        '409': {description: Integrity or provenance conflict}
  /api/v1/datasets/{dataset_id}/fetch:
    post:
      summary: Resumably acquire pinned HTTPS catalog data
      operationId: fetchDataset
      parameters:
        - {name: dataset_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logical_name: {type: string}
                retries: {type: integer, minimum: 0, default: 3}
                timeout: {type: number, exclusiveMinimum: 0, default: 180}
      responses:
        '201': {description: Acquired immutable holdings}
        '403': {description: Data mutation disabled}
        '409': {description: Integrity or provenance conflict}
        '502': {description: Remote acquisition failed}
  /api/v1/datasets/verify:
    post:
      summary: Verify all managed catalog holdings
      operationId: verifyDatasets
      responses:
        '200': {description: Verification passed}
        '409': {description: Corruption detected}
  /api/v1/data/backups:
    post:
      summary: Create a verified portable data-library backup
      operationId: createDataBackup
      responses:
        '201': {description: Backup created}
        '403': {description: Data mutation disabled}
  /api/v1/data/backups/offsite:
    post:
      summary: Create a verified backup under an independent configured root
      operationId: createOffsiteDataBackup
      responses:
        '201': {description: Off-site backup created and verified}
        '400': {description: No independent destination configured}
        '403': {description: Data mutation disabled}
  /api/v1/data/backups/verify:
    post:
      summary: Verify every object in a data-library backup
      operationId: verifyDataBackup
      responses:
        '200': {description: Backup verified}
  /api/v1/data/restores:
    post:
      summary: Restore a verified backup without overwriting conflicts
      operationId: restoreDataBackup
      responses:
        '200': {description: Backup restored}
        '403': {description: Data mutation disabled}
        '409': {description: Integrity or provenance conflict}
  /api/v1/data/restore-drills:
    post:
      summary: Run a full temporary backup and restore verification drill
      operationId: runDataRestoreDrill
      responses:
        '200': {description: Drill passed and durable receipt written}
        '403': {description: Data mutation disabled}
        '409': {description: Drill integrity failure}
  /api/v1/data/gc:
    post:
      summary: Find or remove unreferenced content-addressed objects
      operationId: garbageCollectData
      responses:
        '200': {description: Garbage-collection report}
        '403': {description: Destructive execution disabled}
  /visualizer:
    get:
      summary: Interactive HTML/WebGL dashboard
      operationId: visualizer
      responses:
        '200': {description: HTML page, content: {text/html: {schema: {type: string}}}}
        '404': {description: Visualizer file missing}
  /api/v1/simulate:
    post:
      summary: Run emergent matter simulation
      operationId: simulateV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
            examples:
              basic4d:
                summary: 3 spatial dimensions + entropy state sweep
                value:
                  n: 4
                  weights: [0.3, 0.3, 0.2, 0.2]
                  X_grid:
                    - [-2, -1, 0, 1, 2]
                    - [-2, -1, 0, 1, 2]
                    - [-2, -1, 0, 1, 2]
                    - [0, 0.25, 0.5, 0.75, 1.0]
                  k: 1.0
                  alpha: 1.0
                  C0: 1.0
      responses:
        '200':
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /simulate:
    post:
      summary: Legacy simulation endpoint
      description: Backward-compatible alias for /api/v1/simulate.
      operationId: simulateLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
      responses:
        '200':
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    SimulationRequest:
      type: object
      required: [n, weights, X_grid]
      properties:
        n:
          type: integer
          minimum: 1
          description: Total dimensions (spatial + topological); entropy is swept separately.
        weights:
          type: array
          minItems: 1
          items:
            type: number
          description: One weight per dimension; length must equal n. Entropy weight regulates coupling, not a spatial axis.
        X_grid:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items:
              type: number
          description: One grid array per dimension. Last array is entropy state values (S_1, S_2, ..., S_m); it parameterizes a sweep of thermodynamic states, not a spatial axis.
        k:
          type: number
          default: 1.0
        alpha:
          type: number
          default: 1.0
        C0:
          type: number
          default: 1.0
    SimulationResponse:
      type: object
      required: [M]
      properties:
        M:
          type: array
          description: Nested array of simulated matter values. M[x_1, ..., x_n-1, S_j] is the matter at spatial coordinates x_i and entropy state S_j.
          items:
            oneOf:
              - type: number
              - type: array
                items:
                  oneOf:
                    - type: number
                    - type: array
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Command:
      type: object
      properties:
        name: {type: string}
        script: {type: string}
        category: {type: string}
        summary: {type: string}
        network: {type: boolean}
        gui: {type: boolean}
        exists: {type: boolean}
    Dataset:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        catalog_status: {type: string}
        priority: {type: string}
        version: {type: string, nullable: true}
        url: {type: string}
        holdings:
          type: array
          items: {type: object, additionalProperties: true}
        status:
          type: string
          enum: [planned, present, ok, missing, unregistered, partial, corrupt]
