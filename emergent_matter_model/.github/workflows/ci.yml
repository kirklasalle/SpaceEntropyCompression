name: CI

on:
  push:
    paths:
      - "**.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "test_model.py"
      - "test_server_api.py"
      - "server.py"
      - "model.py"
      - "javafx_client/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "test_model.py"
      - "test_server_api.py"
      - "server.py"
      - "model.py"
      - "javafx_client/**"
      - ".github/workflows/ci.yml"

jobs:
  python-tests:
    name: Python tests (pytest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: emergent_matter_model
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          pytest test_model.py test_server_api.py -v

  javafx-build:
    name: JavaFX client compile
    runs-on: windows-latest
    defaults:
      run:
        working-directory: emergent_matter_model/javafx_client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile JavaFX client
        run: |
          mvn -B -DskipTests compile
