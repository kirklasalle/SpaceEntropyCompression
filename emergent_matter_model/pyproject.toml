[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emergent-matter-model"
version = "0.9.1"
description = "Simulation platform for emergent matter from compressed space-entropy"
readme = "README_3D.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kirk LaSalle"}]

dependencies = [
    "Flask>=3.0,<4",
    "flask-cors>=4.0,<5",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "requests>=2.31,<3",
    "plotly>=5.18,<6",
    "scipy>=1.12,<2",
]

[tool.setuptools]
py-modules = [
    "model",
    "server",
    "visualize",
    "viz3d",
    "compare_schwarzschild",
    "physics_baseline",
    "fit_astrometry",
    "fit_sparc",
    "emrf_cli",
    "emrf_registry",
    "emrf_version",
    "data_provenance",
    "emrf_paths",
    "fetch_real_data",
    "fetch_sparc",
    "fit_jwst",
    "jwst_highz_early_galaxies",
    "lensing_engine",
    "cmb_acoustic_engine",
    "cosmology_expansion",
    "sparc_real_analysis",
    "sparc_marginalized_a0",
    "sparc_tension_diagnostics",
    "sparc_bulge_test",
    "stress_test_blind_challenge",
    "stress_test_cmb_peaks",
    "stress_test_cosmology_expansion",
    "stress_test_equivalence_principle",
    "stress_test_galaxy_scatter",
    "stress_test_gw_speed",
    "stress_test_solar_system",
    "stress_test_stability_ghosts",
    "stress_test_wide_binaries",
    "bullet_cluster_stress_test",
    "plot_cosmology_figures",
    "plot_deep_perspectives",
    "plot_extreme_rigor_figures",
    "plot_publication_figures",
    "plot_three_horizons_figures",
    "wsgi",
    "black_hole_horizon_entropy",
    "quantum_vibrational_compression",
]

packages = ["emrf", "emrf.data", "emrf.interfaces", "emrf.physics"]

[tool.setuptools.package-dir]
emrf = "src/emrf"
"emrf.data" = "src/emrf/data"
"emrf.interfaces" = "src/emrf/interfaces"
"emrf.physics" = "src/emrf/physics"

[project.scripts]
emrf = "emrf.interfaces.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.2",
    "mypy>=1.8",
    "types-Flask-Cors>=4.0",
]
server = [
    "gunicorn>=21.2,<23",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
