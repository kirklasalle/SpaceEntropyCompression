name: Operational certification

on:
  schedule:
    - cron: "41 5 8 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operational-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Recovery and performance evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require current protected main commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints-ci.txt
      - name: Install certified dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints-ci.txt
      - name: Run controlled operational certification
        id: certification
        continue-on-error: true
        run: >-
          python tools/run_operational_certification.py
          --workspace operational-certification
          --receipt operational-certification/evidence/summary.json
          --profile standard
          --repeats 2
      - name: Retain operational evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operational-certification-${{ github.sha }}-${{ github.run_id }}
          path: operational-certification/evidence/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce operational certification
        if: steps.certification.outcome == 'failure'
        run: exit 1
