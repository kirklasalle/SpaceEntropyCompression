name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-release.txt
            constraints-ci.txt
      - name: Install certified dependencies
        run: >-
          python -m pip install
          -r requirements-dev.txt
          -r requirements-release.txt
          -c constraints-ci.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Audit installed dependencies
        id: audit
        continue-on-error: true
        run: >-
          python -m pip_audit
          --local
          --skip-editable
          --format json
          --output dependency-audit.json
      - name: Generate reproducible CycloneDX SBOM
        run: >-
          cyclonedx-py environment
          --output-format JSON
          --output-reproducible
          --validate
          --output-file emrf-certification-environment.cdx.json
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-evidence
          path: |
            dependency-audit.json
            emrf-certification-environment.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce clean dependency audit
        if: steps.audit.outcome == 'failure'
        run: exit 1

  package-metadata:
    name: Package and release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install release tools
        run: python -m pip install -r requirements-release.txt
      - name: Validate synchronized metadata
        run: python tools/validate_release_metadata.py
      - name: Build distributions
        run: python -m build emergent_matter_model
      - name: Validate distribution metadata
        run: python -m twine check emergent_matter_model/dist/*

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
