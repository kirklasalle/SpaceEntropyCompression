name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require current protected main commit
        run: |
          git fetch origin main --no-tags
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"

  validate:
    name: Release validation and supply chain
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-release.txt
            constraints-ci.txt
      - name: Install certified release environment
        run: >-
          python -m pip install
          -r requirements-dev.txt
          -r requirements-release.txt
          -c constraints-ci.txt
      - name: Verify release tag and metadata
        run: python tools/validate_release_metadata.py --tag "${GITHUB_REF_NAME}"
      - name: Verify dependencies
        run: python -m pip check
      - name: Run non-golden suite
        run: python -m pytest -m "not golden" -q
      - name: Validate generated documentation
        run: |
          python tools/generate_docs_reference.py --check
          mkdocs build --strict
      - name: Audit installed dependencies
        run: >-
          python -m pip_audit
          --local
          --skip-editable
          --format json
          --output dependency-audit.json
      - name: Generate reproducible CycloneDX SBOM
        run: >-
          cyclonedx-py environment
          --output-format JSON
          --output-reproducible
          --validate
          --output-file emrf-certification-environment.cdx.json
      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-supply-chain-evidence
          path: |
            dependency-audit.json
            emrf-certification-environment.cdx.json
          if-no-files-found: error

  golden:
    name: Release golden ${{ matrix.case }}
    needs: source
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case:
          - sparc-real-analysis
          - sparc-marginalized-a0
          - sparc-tension-diagnostics
          - sparc-bulge-test
          - fit-pantheon-covariance
          - sparc-profile-validation
          - sparc-influence
          - real-data-gauntlet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints-ci.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints-ci.txt
      - name: Fetch SPARC
        run: python emergent_matter_model/fetch_real_data.py --sparc
      - name: Fetch pinned Pantheon+ inputs
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlopen

          release = "c447f0fea703fcd0fff57de5000947b5ca81286b"
          base = (
              "https://raw.githubusercontent.com/PantheonPlusSH0ES/"
              f"DataRelease/{release}/Pantheon%2B_Data/4_DISTANCES_AND_COVAR/"
          )
          output = Path("data/external")
          output.mkdir(parents=True, exist_ok=True)
          for source, target in (
              ("Pantheon%2BSH0ES.dat", "Pantheon+SH0ES.dat.txt"),
              ("Pantheon%2BSH0ES_STAT%2BSYS.cov", "Pantheon+SH0ES_STAT+SYS.cov.txt"),
          ):
              (output / target).write_bytes(urlopen(base + source, timeout=300).read())
      - name: Verify datasets against pinned catalog hashes
        run: |
          python emergent_matter_model/emrf_cli.py data import sparc-rotation-curves
          python emergent_matter_model/emrf_cli.py data import pantheon-plus-shoes
      - name: Run scientific golden suite
        run: python tools/run_golden_results.py ${{ matrix.case }}

  publish:
    name: Build, attest, and publish release
    needs: [validate, golden]
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install release tools
        run: python -m pip install -r requirements-release.txt
      - name: Build distributions and release notes
        run: |
          python tools/validate_release_metadata.py \
            --tag "${GITHUB_REF_NAME}" \
            --write-release-notes release/release-notes.md
          python -m build --outdir release emergent_matter_model
          python -m twine check release/*.whl release/*.tar.gz
          cp CITATION.cff codemeta.json .zenodo.json release/
      - name: Download supply-chain evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-supply-chain-evidence
          path: release
      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emrf-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/*
          --verify-tag
          --title "EMRF ${GITHUB_REF_NAME#v}"
          --notes-file release/release-notes.md
