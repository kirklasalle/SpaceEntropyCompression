name: Release health

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Published stable release tag; blank selects the latest release"
        required: false
        type: string

permissions:
  attestations: read
  contents: read

concurrency:
  group: release-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearse:
    name: Rehearse latest stable release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve immutable stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          requested="$REQUESTED_TAG"
          if [[ -z "$requested" ]]; then
            requested="$(gh release view --json tagName --jq .tagName)"
          fi
          [[ "$requested" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_json="$(gh release view "$requested" --json isDraft,isPrerelease,tagName,url)"
          test "$(jq -r .tagName <<<"$release_json")" = "$requested"
          test "$(jq -r .isDraft <<<"$release_json")" = "false"
          test "$(jq -r .isPrerelease <<<"$release_json")" = "false"
          registry=release/archives.json
          release_doi="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["releases"][sys.argv[2]]["doi"])' "$registry" "$requested")"
          expected_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["releases"][sys.argv[2]]["source_sha"])' "$registry" "$requested")"
          expected_url="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["releases"][sys.argv[2]]["release_url"])' "$registry" "$requested")"
          [[ "$release_doi" =~ ^10\.[0-9]{4,9}/[-._;()/:A-Za-z0-9]+$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(jq -r .url <<<"$release_json")" = "$expected_url"
          test "$(git cat-file -t "$requested")" = "tag"
          release_sha="$(git rev-list -n 1 "$requested")"
          test "$release_sha" = "$expected_sha"
          git checkout --detach "$release_sha"
          {
            echo "RELEASE_TAG=$requested"
            echo "RELEASE_SHA=$release_sha"
            echo "RELEASE_URL=$expected_url"
            echo "RELEASE_DOI=$release_doi"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Install release tools
        run: python -m pip install -r requirements-release.txt
      - name: Validate tag metadata and rebuild distributions
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_release_metadata.py --tag "$RELEASE_TAG"
          python -m build --outdir rehearsal-build emergent_matter_model
          python -m twine check rehearsal-build/*
      - name: Download published release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --dir published-release
      - name: Verify complete checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd published-release
          sha256sum --check --strict SHA256SUMS
          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          manifest = root / "SHA256SUMS"
          covered = set()
          for line in manifest.read_text(encoding="utf-8").splitlines():
              digest, marker, name = line.partition("  ")
              if marker != "  " or len(digest) != 64 or not name:
                  raise SystemExit(f"invalid SHA256SUMS entry: {line!r}")
              path = Path(name)
              if path.is_absolute() or path.name != name or name in covered:
                  raise SystemExit(f"unsafe or duplicate SHA256SUMS path: {name!r}")
              covered.add(name)
          assets = {path.name for path in root.iterdir() if path.name != manifest.name}
          if covered != assets:
              raise SystemExit(
                  f"checksum coverage mismatch: missing={assets - covered}, "
                  f"unexpected={covered - assets}"
              )
          PY
      - name: Verify release provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in published-release/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$RELEASE_SHA" \
              --deny-self-hosted-runners
          done
      - name: Exercise isolated installed release
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find published-release -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          venv="$RUNNER_TEMP/emrf-release-health"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install "$wheel"
          cd "$RUNNER_TEMP"
          "$venv/bin/emrf" doctor --json > emrf-doctor.json
          "$venv/bin/python" - <<'PY'
          from emrf.interfaces.api_v2 import create_app
          from emrf.sdk import EMRFClient

          client = EMRFClient()
          assert client.list_commands().commands
          assert client.validate_knowledge().valid
          paths = create_app(client).openapi()["paths"]
          required_paths = {
              "/api/v2/health",
              "/api/v2/doctor",
              "/api/v2/commands",
              "/api/v2/datasets",
              "/api/v2/knowledge",
              "/api/v2/knowledge/validate",
          }
          assert required_paths <= paths.keys()
          PY
      - name: Confirm archival DOI resolution
        run: >-
          curl --fail --location --retry 3 --retry-all-errors
          --output /dev/null "https://doi.org/$RELEASE_DOI"
      - name: Write rehearsal receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          receipt = {
              "schema_version": "1.0",
              "verified_at": datetime.now(timezone.utc).isoformat(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "release_tag": os.environ["RELEASE_TAG"],
              "release_sha": os.environ["RELEASE_SHA"],
              "release_url": os.environ["RELEASE_URL"],
              "doi": os.environ["RELEASE_DOI"],
              "checks": {
                  "metadata": "passed",
                  "source_rebuild": "passed",
                  "checksums": "passed",
                  "attestations": "passed",
                  "isolated_install": "passed",
                  "doctor": "passed",
                  "sdk": "passed",
                  "api_v2_openapi": "passed",
                  "knowledge": "passed",
                  "doi_resolution": "passed",
              },
          }
          Path("release-health-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Retain rehearsal receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-health-${{ env.RELEASE_TAG }}-${{ github.run_id }}
          path: release-health-receipt.json
          if-no-files-found: error
          retention-days: 90
