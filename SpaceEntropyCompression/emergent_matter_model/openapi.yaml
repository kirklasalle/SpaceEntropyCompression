openapi: 3.0.3
info:
  title: Emergent Matter Simulation API
  version: 1.0.0
  description: |
    REST API for emergent matter simulation where entropy (S) is the last
    model dimension and acts as the quantifiable clock.
servers:
  - url: http://127.0.0.1:5000
paths:
  /api/v1/simulate:
    post:
      summary: Run emergent matter simulation
      operationId: simulateV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
            examples:
              basic4d:
                summary: 3 spatial + 1 entropy dimension
                value:
                  n: 4
                  weights: [0.3, 0.3, 0.2, 0.2]
                  X_grid:
                    - [-2, -1, 0, 1, 2]
                    - [-2, -1, 0, 1, 2]
                    - [-2, -1, 0, 1, 2]
                    - [0, 0.25, 0.5, 0.75, 1.0]
                  k: 1.0
                  alpha: 1.0
                  C0: 1.0
      responses:
        '200':
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /simulate:
    post:
      summary: Legacy simulation endpoint
      description: Backward-compatible alias for /api/v1/simulate.
      operationId: simulateLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
      responses:
        '200':
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    SimulationRequest:
      type: object
      required: [n, weights, X_grid]
      properties:
        n:
          type: integer
          minimum: 1
          description: Total dimensions including entropy as the last dimension.
        weights:
          type: array
          minItems: 1
          items:
            type: number
          description: One weight per dimension; length must equal n.
        X_grid:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items:
              type: number
          description: One grid array per dimension; last array is entropy S grid.
        k:
          type: number
          default: 1.0
        alpha:
          type: number
          default: 1.0
        C0:
          type: number
          default: 1.0
    SimulationResponse:
      type: object
      required: [M]
      properties:
        M:
          type: array
          description: N-dimensional nested array of simulated matter values.
          items:
            oneOf:
              - type: number
              - type: array
                items:
                  oneOf:
                    - type: number
                    - type: array
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
