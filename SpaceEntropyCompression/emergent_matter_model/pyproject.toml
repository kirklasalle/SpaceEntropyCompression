[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emergent-matter-model"
version = "0.6.0"
description = "Simulation platform for emergent matter from compressed space-entropy"
readme = "README_3D.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kirk LaSalle"}]

dependencies = [
    "Flask>=3.0,<4",
    "flask-cors>=4.0,<5",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "requests>=2.31,<3",
    "plotly>=5.18,<6",
    "scipy>=1.12,<2",
    "pyyaml>=6.0,<7",
]

[tool.setuptools]
py-modules = [
    "model",
    "server",
    "visualize",
    "viz3d",
    "compare_schwarzschild",
    "physics_baseline",
    "fit_astrometry",
    "fit_sparc",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.2",
    "mypy>=1.8",
    "types-Flask-Cors>=4.0",
]
server = [
    "gunicorn>=21.2,<23",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
